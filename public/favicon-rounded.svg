<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <clipPath id="r">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>
  <!-- 品牌深蓝底色，与 logo 原始背景一致，无需抠图 -->
  <rect width="100" height="100" rx="22" ry="22" fill="#0c1925"/>
  <!-- logo 居中，等比缩放填充 -->
  <image href="/logo.png" x="0" y="0" width="100" height="100" clip-path="url(#r)" preserveAspectRatio="xMidYMid meet"/>
</svg>
